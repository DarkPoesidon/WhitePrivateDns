      <!-- ============================================== -->
      <!-- TAB 3: LIVE QUERY STREAM CONSOLE -->
      <!-- ============================================== -->
      <section id="tab-stream" class="tab-content space-y-4 hidden">
        <div class="glass-panel p-4 sm:p-5">

          <!-- Stream Controls Bar -->
          <!-- `flex-wrap` plus a flexible search box rather than a second breakpoint. The bar
               used to be `flex-col sm:flex-row` with a fixed `sm:w-64` search, which fits the
               viewport at 640px but not the panel: from 768px up a 256px sidebar appears, so
               the panel's content box is 422px while the row wants 374 + 12 + 149 = 535px, and
               the Clear button was pushed 68px off the start edge — clipped, unreachable, only
               in the 768-1023 band. Wrapping fixes the whole band instead of one width: the
               search group takes what is left with `sm:flex-1 sm:min-w-[180px]`, and the button
               group drops to its own line whenever both cannot share one, kept at the end edge
               by `sm:ms-auto` (with a single item on a wrapped line, `justify-between` would
               otherwise pull it back to the start). -->
          <div class="flex flex-col sm:flex-row flex-wrap items-center justify-between gap-2.5 sm:gap-3 pb-3 sm:pb-4 border-b border-slate-800">
            <div class="flex items-center gap-2 sm:gap-3 w-full sm:w-auto sm:flex-1 sm:min-w-[180px]">
              <div class="relative w-full sm:flex-1 sm:min-w-0">
                <input type="text" id="stream-search" aria-label="Search live queries" placeholder="Search domain or IP..."
                  class="w-full ps-8 pe-3 py-1.5 rounded-lg bg-slate-950 border border-slate-700 text-xs text-white focus:outline-none focus:border-cyan-400 font-mono">
                <i data-feather="search" class="w-3.5 h-3.5 text-slate-500 absolute start-2.5 top-2.5"></i>
              </div>

              <!-- Filter Selector -->
              <select id="stream-filter" aria-label="Filter live queries by action" class="shrink-0 bg-slate-950 border border-slate-700 text-xs text-slate-300 rounded-lg px-2.5 py-1.5 focus:outline-none focus:border-cyan-400 font-mono">
                <option value="ALL">All Actions</option>
                <option value="PROXY">PROXY</option>
                <option value="DIRECT">DIRECT</option>
                <option value="BLOCK">BLOCK</option>
                <option value="CACHED">CACHED</option>
              </select>
            </div>

            <div class="flex items-center gap-2 w-full sm:w-auto sm:ms-auto sm:shrink-0 justify-end">
              <button id="stream-pause-btn" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-semibold text-slate-300 border border-slate-700 flex items-center gap-1.5 transition">
                <i data-feather="pause" class="w-3.5 h-3.5"></i> <span>Pause</span>
              </button>
              <button id="stream-clear-btn" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-semibold text-slate-300 border border-slate-700 flex items-center gap-1.5 transition">
                <i data-feather="trash-2" class="w-3.5 h-3.5"></i> <span>Clear</span>
              </button>
            </div>
          </div>

          <!-- Live Log Stream Table -->
          <!-- Seven monospace columns do not fit a 360px phone, and collapsing a live log to
               stacked cards would cost the density that makes it worth watching. So the table
               keeps its shape and scrolls sideways inside this wrapper, and the two columns
               that answer the least on a phone — PROTO and RULE MATCHED — are dropped below
               `sm`. That, plus tighter cell padding and a narrower domain clamp, takes the
               resting width from 600px to 420px: about 126px of travel at 360px instead of
               306px. queryRowHTML in app.js carries the same `hidden sm:table-cell` pair on
               its third and fifth cells; the two must move together or the header and the
               body will disagree about which column is which. The placeholder rows keep
               colspan="7" — a colspan wider than the visible column count is harmless.

               What sets the remaining travel is `min-w-[420px]`, NOT the column count.
               Measured on a 360px viewport (294px of usable wrapper): hiding TIME as well
               left the travel at exactly 126px and merely redistributed the freed 78px among
               the four survivors, so it was rejected — it costs a column and buys nothing.
               Dropping the min-width to ~294px instead would fit with no swipe at all, but
               then the domain clamps to about twelve characters with no way to read the rest:
               `title` needs a hover a touchscreen does not have, and with zero travel there
               is nothing left to swipe. 420px is the compromise — the domain stays legible,
               ACTION and LATENCY are one thumb-nudge away, and the page itself never
               overflows (documentElement.scrollWidth stays 360). -->
          <div class="overflow-x-auto mt-3 max-h-[500px] overflow-y-auto">
            <table class="w-full text-start border-collapse text-xs font-mono min-w-[420px] sm:min-w-[600px]">
              <caption class="sr-only">Live DNS query log</caption>
              <thead class="bg-slate-950/80 sticky top-0 text-slate-400 border-b border-slate-800 z-10">
                <tr>
                  <th class="py-2.5 px-2 sm:px-3">TIME</th>
                  <th class="py-2.5 px-2 sm:px-3">CLIENT / ACCOUNT</th>
                  <th class="py-2.5 px-2 sm:px-3 hidden sm:table-cell">PROTO</th>
                  <th class="py-2.5 px-2 sm:px-3">QUERY DOMAIN</th>
                  <th class="py-2.5 px-2 sm:px-3 hidden sm:table-cell">RULE MATCHED</th>
                  <th class="py-2.5 px-2 sm:px-3">ACTION</th>
                  <th class="py-2.5 px-2 sm:px-3 text-end">LATENCY</th>
                </tr>
              </thead>
              <tbody id="stream-tbody" class="divide-y divide-slate-800/50 text-slate-300">
                <!-- Dynamically populated via SSE. stream-placeholder marks this row as the
                     empty state: app.js recognises it by that class and replaces it with the
                     first real query. It used to look for the word "Listening" in the row's
                     text instead, so rewording this copy would have pinned the placeholder
                     above every query for the life of the page. -->
                <tr class="stream-placeholder">
                  <td colspan="7" class="py-12 text-center text-slate-500">
                    <div class="flex flex-col items-center gap-2">
                      <div class="pulse-dot"></div>
                      <span>Listening for live DNS queries...</span>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>

        </div>
      </section>
