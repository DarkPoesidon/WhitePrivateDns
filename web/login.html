<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2312a37f' stroke-width='2'%3E%3Cpath d='M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z'/%3E%3C/svg%3E">
  <title>WhitePrivateDns — Sign in</title>
  <!--
    Standalone login document (v2.1.0 Phase A).

    This page deliberately does NOT load the dashboard bundle: before it existed,
    the sign-in route served the full SPA shell to every unauthenticated visitor,
    so the whole admin front-end — its markup, its API surface, its JS — was
    readable pre-auth by anyone holding the namespace. This document is
    self-contained: inline CSS and two small inline scripts, no external asset
    requests at all, so there is nothing to load, nothing to fingerprint, and
    nothing that phones home before the operator signs in.

    The server replaces the value of the ADMIN_BASE variable below with the
    install's hidden namespace ("/<16-hex>") at serve time; every fetch is built
    from it.
  -->
  <script>
    // Same theme key as the React panel, applied before first paint so the page
    // does not flash the wrong colours.
    try {
      var savedTheme = localStorage.getItem('wpdns_ui_theme');
      if (savedTheme === 'light' || savedTheme === 'dark' || savedTheme === 'ultra') document.documentElement.setAttribute('data-theme', savedTheme);
    } catch (e) { /* storage blocked: the system preference below decides */ }
  </script>
  <style>
    /* Colour values mirror the Ant Design tokens the React panel uses
       (frontend/src/theme.tsx), so signing in does not look like a different product. */
    :root {
      color-scheme: dark;
      --bg: #0d0d0d;
      --panel: #141414;
      --border: #303030;
      --text: rgba(255, 255, 255, .88);
      --muted: rgba(255, 255, 255, .55);
      --accent: #12a37f;
      --accent-hover: #2bb592;
      --on-accent: #fff;
      --ring: rgba(18, 163, 127, .25);
      --danger: #ff7875;
      --danger-bg: rgba(255, 77, 79, .1);
      --danger-border: rgba(255, 77, 79, .35);
      --field: #1f1f1f;
    }
    :root[data-theme="ultra"] { --bg: #000; --panel: #0a0a0a; --field: #101010; --border: #262626; }
    :root[data-theme="light"] {
      color-scheme: light;
      --bg: #f5f5f5;
      --panel: #fff;
      --border: #d9d9d9;
      --text: rgba(0, 0, 0, .88);
      --muted: rgba(0, 0, 0, .55);
      --accent: #0f8a6b;
      --accent-hover: #12a37f;
      --danger: #cf1322;
      --danger-bg: #fff1f0;
      --danger-border: #ffccc7;
      --field: #fff;
    }
    @media (prefers-color-scheme: light) {
      :root:not([data-theme]) {
        color-scheme: light;
        --bg: #f5f5f5;
        --panel: #fff;
        --border: #d9d9d9;
        --text: rgba(0, 0, 0, .88);
        --muted: rgba(0, 0, 0, .55);
        --accent: #0f8a6b;
        --accent-hover: #12a37f;
        --danger: #cf1322;
        --danger-bg: #fff1f0;
        --danger-border: #ffccc7;
        --field: #fff;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: Inter, Vazirmatn, system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .card {
      width: 100%;
      max-width: 24rem;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: .75rem;
      padding: 2rem 1.75rem 1.25rem;
    }
    .brand { display: flex; align-items: center; gap: .75rem; margin-bottom: 1.5rem; }
    .brand-logo {
      width: 2.5rem; height: 2.5rem; flex: none;
      display: flex; align-items: center; justify-content: center;
      border-radius: .5rem;
      background: var(--accent);
    }
    .brand-logo svg { width: 1.25rem; height: 1.25rem; stroke: var(--on-accent); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .brand-name { font-size: 1.125rem; font-weight: 600; line-height: 1.3; }
    .brand-sub { font-size: .8125rem; color: var(--muted); }
    label { display: block; font-size: .875rem; color: var(--text); margin: 1rem 0 .375rem; }
    input {
      width: 100%;
      min-height: 2.5rem;
      background: var(--field);
      border: 1px solid var(--border);
      border-radius: .5rem;
      color: var(--text);
      font: inherit;
      font-size: 1rem;
      padding: .5rem .75rem;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    input:hover { border-color: var(--accent-hover); }
    input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--ring); }
    input::placeholder { color: var(--muted); }
    #login-code { letter-spacing: .35em; text-align: center; direction: ltr; }
    .hidden { display: none !important; }
    .error {
      display: none;
      margin-top: 1rem;
      padding: .5rem .75rem;
      border: 1px solid var(--danger-border);
      background: var(--danger-bg);
      border-radius: .5rem;
      color: var(--danger);
      font-size: .875rem;
    }
    .error.is-shown { display: block; }
    button[type="submit"] {
      width: 100%;
      min-height: 2.5rem;
      margin-top: 1.25rem;
      border: 0;
      border-radius: .5rem;
      font: inherit;
      font-size: .9375rem;
      font-weight: 600;
      color: var(--on-accent);
      background: var(--accent);
      cursor: pointer;
      transition: background-color .15s;
    }
    button[type="submit"]:hover { background: var(--accent-hover); }
    button[type="submit"]:disabled { opacity: .6; cursor: wait; }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .foot { margin-top: 1rem; display: flex; justify-content: center; }
    .foot .lang { min-height: 2.25rem; background: none; border: 0; color: var(--muted); border-radius: .5rem; padding: .25rem .75rem; cursor: pointer; font: inherit; font-size: .875rem; }
    .foot .lang:hover { color: var(--accent); }
    @media (pointer: coarse) { .foot .lang { min-height: 2.75rem; } }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <div class="brand-logo" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      </div>
      <div>
        <h1 class="brand-name">WhitePrivateDns</h1>
        <div class="brand-sub" data-i18n="sub">Admin panel</div>
      </div>
    </div>

    <form id="login-form" novalidate>
      <label for="login-username" data-i18n="username">Admin username</label>
      <input type="text" id="login-username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>

      <label for="login-password" data-i18n="password">Password</label>
      <input type="password" id="login-password" name="password" autocomplete="current-password" required>

      <div id="login-2fa-row" class="hidden">
        <label for="login-code" data-i18n="twofa">Two-factor code</label>
        <input type="text" id="login-code" name="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="000000">
      </div>

      <div id="login-error" class="error" role="alert" aria-live="assertive"></div>

      <button type="submit" id="login-submit" data-i18n="submit">Sign in</button>
    </form>

    <div class="foot">
      <button type="button" class="lang" id="lang-btn">فارسی</button>
    </div>
  </main>

  <script>
    (function () {
      'use strict';

      // The hidden namespace this install lives under: the server splices it in
      // as the value of ADMIN_BASE below. Same shape the dashboard bundle
      // derives from the address bar: exactly 16 lowercase hex characters.
      var ADMIN_BASE = "__WPDNS_ADMIN_BASE__";
      var m = window.location.pathname.match(/^\/([0-9a-f]{16})(?=\/|$)/);
      // The derived value wins when the page was reached at a matching path; the
      // injected one covers odd proxy rewrites. An empty replacement (a root
      // mount) degrades to the pre-v2.1 root paths.
      var BASE = m ? '/' + m[1] : ADMIN_BASE;

      /* --- i18n (fa/en, client-side; no server round trip) ------------------- */
      var DICT = {
        en: {
          sub: 'Admin panel',
          username: 'Admin username', password: 'Password', twofa: 'Two-factor code',
          submit: 'Sign in',
          errGeneric: 'Invalid credentials', errNet: 'Server connection failed',
          errWait: 'Too many attempts. Wait a few minutes and try again.',
          errCode: 'Your password was accepted — enter the 6-digit code from your authenticator app.',
          switchTo: 'فارسی'
        },
        fa: {
          sub: 'پنل مدیریت',
          username: 'نام کاربری مدیر', password: 'رمز عبور', twofa: 'کد دو‌مرحله‌ای',
          submit: 'ورود',
          errGeneric: 'نام کاربری یا رمز عبور اشتباه است', errNet: 'اتصال به سرور برقرار نشد',
          errWait: 'تلاش‌های ناموفق زیاد است. چند دقیقه بعد دوباره امتحان کنید.',
          errCode: 'رمز شما تأیید شد — کد ۶ رقمی اپلیکیشن احراز هویت را وارد کنید.',
          switchTo: 'English'
        }
      };
      var lang = 'en';
      try {
        lang = new URLSearchParams(window.location.search).get('lang')
          || localStorage.getItem('wpdns_ui_lang')
          || localStorage.getItem('wpdns_lang')
          || (navigator.language && navigator.language.indexOf('fa') === 0 ? 'fa' : 'en');
      } catch (e) { /* storage blocked — default en */ }
      if (lang !== 'fa') lang = 'en';

      function applyLang() {
        var t = DICT[lang];
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === 'fa' ? 'rtl' : 'ltr';
        document.title = 'WhitePrivateDns — ' + (lang === 'fa' ? 'ورود' : 'Sign in');
        var nodes = document.querySelectorAll('[data-i18n]');
        for (var i = 0; i < nodes.length; i++) {
          var k = nodes[i].getAttribute('data-i18n');
          if (t[k]) nodes[i].textContent = t[k];
        }
        document.getElementById('lang-btn').textContent = t.switchTo;
      }
      document.getElementById('lang-btn').addEventListener('click', function () {
        lang = lang === 'fa' ? 'en' : 'fa';
        try { localStorage.setItem('wpdns_lang', lang); localStorage.setItem('wpdns_ui_lang', lang); } catch (e) { /* private mode */ }
        applyLang();
      });
      applyLang();

      /* --- Submit ------------------------------------------------------------ */
      var errBox = document.getElementById('login-error');
      var codeRow = document.getElementById('login-2fa-row');
      var submitBtn = document.getElementById('login-submit');

      function showError(text) {
        errBox.textContent = text;
        errBox.classList.add('is-shown');
      }

      document.getElementById('login-form').addEventListener('submit', function (e) {
        e.preventDefault();
        var username = document.getElementById('login-username').value.trim();
        var password = document.getElementById('login-password').value;
        var code = document.getElementById('login-code').value.trim();
        errBox.classList.remove('is-shown');

        submitBtn.disabled = true;
        fetch(BASE + '/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: username, password: password, code: code })
        }).then(function (res) {
          return res.json().catch(function () { return {}; }).then(function (body) {
            if (!res.ok) {
              var t = DICT[lang];
              if (res.status === 429) {
                showError(t.errWait);
              } else if (res.status === 401 && body && body.twofactor_required) {
                // The password verified; the second factor is what failed. Reveal
                // the code row and focus it — never shown on a plain wrong password.
                codeRow.classList.remove('hidden');
                document.getElementById('login-code').focus();
                showError(t.errCode);
              } else {
                // A 401's body is English server text; the page's own string is translated.
                showError(res.status !== 401 && body && body.error ? String(body.error) : t.errGeneric);
              }
              return;
            }
            if (!body || !body.token) {
              showError(DICT[lang].errNet);
              return;
            }
            try { localStorage.setItem('whiteprivatedns_token', body.token); localStorage.setItem('wpdns_ui_lang', lang); } catch (e2) { /* private mode */ }
            window.location.replace(BASE + '/ui/');
          });
        }).catch(function () {
          showError(DICT[lang].errNet);
        }).then(function () {
          submitBtn.disabled = false;
        });
      });

      // Focus the first empty field, for keyboard operators.
      var first = document.getElementById('login-username');
      if (first && !first.value) first.focus();
    })();
  </script>
</body>
</html>
